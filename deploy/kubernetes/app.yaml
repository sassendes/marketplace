apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  labels:
    app.kubernetes.io/name: marketplace
    app.kubernetes.io/component: app
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketplace
        app.kubernetes.io/component: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: marketplace
              app.kubernetes.io/component: app
      initContainers:
        - name: migrate
          image: marketplace
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: marketplace
          securityContext: &secure
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      containers:
        - name: app
          image: marketplace
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - configMapRef:
                name: marketplace
            - secretRef:
                name: marketplace
          securityContext: *secure
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { memory: 384Mi }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace
  labels:
    app.kubernetes.io/name: marketplace
spec:
  selector:
    app.kubernetes.io/name: marketplace
    app.kubernetes.io/component: app
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: marketplace
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: marketplace
      app.kubernetes.io/component: app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketplace
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: marketplace-seed
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: marketplace
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: marketplace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: seed
          image: marketplace
          args: ["seed"]
          envFrom:
            - secretRef:
                name: marketplace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
