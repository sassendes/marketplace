apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: engines-only-from-app
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [search, fraud]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mercatus
              app.kubernetes.io/component: app
      ports:
        - { port: 8092 }
        - { port: 8093 }
